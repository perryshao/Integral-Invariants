# Preserve legacy APIs and research parameters; format layout only.
project_root
exclude_dir: "thirdparty"
exclude_dir: "legacy"
exclude_dir: ".git"
indent_function_file_body: false
tab_width: 4
newline_style: "lf"
suppress_rule: "copyright_notice"
suppress_rule: "naming_functions"
suppress_rule: "naming_parameters"
suppress_rule: "naming_scripts"
suppress_rule: "naming_classes"
suppress_rule: "naming_enumerations"
suppress_rule: "file_length"
suppress_rule: "line_length"
suppress_rule: "end_of_statements"
suppress_rule: "spurious_row_comma"
suppress_rule: "spurious_row_semicolon"
suppress_rule: "redundant_brackets"
suppress_rule: "implicit_shortcircuit"
suppress_rule: "builtin_shadow"
suppress_rule: "unicode"
suppress_rule: "operator_after_continuation"
suppress_rule: "useless_continuation"
